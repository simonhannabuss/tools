# Runs the app on the server. Your existing website (Apache or Nginx) forwards
# https://simonhannabuss.co.uk/tools to the "web" container on 127.0.0.1:3000 —
# see deploy/apache-tools.conf or deploy/nginx-tools.conf.
services:
  web:
    build: .
    command: ["npm", "run", "start"]
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000" # only reachable from the server itself, not the internet
    volumes:
      - media:/data/media
    depends_on: [postgres, redis]
    restart: always

  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    volumes:
      - media:/data/media
    depends_on: [postgres, redis]
    restart: always

  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: tools
      POSTGRES_DB: tools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: docker.io/library/redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: always

volumes:
  media:
  pgdata:
  redisdata:
