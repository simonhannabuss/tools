services:
  web:
    build: .
    command: ["npm", "run", "start"]
    env_file: .env
    volumes:
      - media:/data/media
    depends_on: [postgres, redis]
    restart: unless-stopped

  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    volumes:
      - media:/data/media
    depends_on: [postgres, redis]
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tools
      POSTGRES_DB: tools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web]
    restart: unless-stopped

volumes:
  media:
  pgdata:
  redisdata:
  caddydata:
