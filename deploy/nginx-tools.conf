# Nginx: forward /tools to the app.
# Add inside the "server { listen 443 ssl; server_name simonhannabuss.co.uk; ... }" block,
# then: sudo nginx -t && sudo systemctl reload nginx

# Always public (platforms call these) — keep these even after Tailscale is on.
location ~ ^/tools/(oauth/callback/|media/s/|health|privacy) {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 900s;
}

location /tools {
    # LATER (Tailscale): only allow your own devices.
    # allow 100.64.0.0/10;
    # deny all;

    client_max_body_size 4g;           # big video uploads
    proxy_request_buffering off;       # stream uploads instead of buffering to disk first
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
