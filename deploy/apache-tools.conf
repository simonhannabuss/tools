# Apache (cPanel / Plesk / plain Apache): forward /tools to the app.
# Add inside the <VirtualHost *:443> block for simonhannabuss.co.uk
# (cPanel: WHM → Apache Configuration → Include Editor, or a userdata include;
#  Plesk: Domains → Apache & nginx Settings → "Additional directives for HTTPS").
# Needs mod_proxy and mod_proxy_http enabled.

ProxyPreserveHost On
ProxyTimeout 900
RequestHeader set X-Forwarded-Proto "https"

<Location /tools>
    # Allow big video uploads (0 = no limit; Apache 2.4.54+ otherwise caps at 1 GB)
    LimitRequestBody 0
    ProxyPass        http://127.0.0.1:3000/tools
    ProxyPassReverse http://127.0.0.1:3000/tools

    # LATER (Tailscale): only allow your own devices to reach the dashboard.
    # Keep the public paths below open.
    # Require ip 100.64.0.0/10
</Location>

# These must stay public even with Tailscale on (platforms call them):
# <LocationMatch "^/tools/(oauth/callback/|media/s/|health)">
#     Require all granted
# </LocationMatch>
